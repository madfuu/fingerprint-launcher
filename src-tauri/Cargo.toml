[package]
name = "fingerprint-launcher"
version = "0.1.0"
description = "Desktop GUI launcher for fingerprint-chromium profiles"
authors = ["madfuu"]
license = "MIT"
repository = "https://github.com/madfuu/fingerprint-launcher"
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a name clash with the binary target on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "fingerprint_launcher_lib"
# Desktop only. The Tauri template's `staticlib` / `cdylib` outputs are for mobile targets and
# would be linked on every build and test run.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.28.0", features = ["v4"] }
chrono = "0.4.45"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
# Reads Info.plist of macOS kernels on every host; tauri-utils already depends on it.
plist = "1.10.1"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-clipboard-manager = "2.4.2"
# testProxy only. rustls with the ring provider (installed at runtime): reqwest's default
# aws-lc-rs provider needs extra build tools on Windows, and native-tls would pull in OpenSSL.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "socks"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", features = ["hostname", "signal"] }

[target.'cfg(windows)'.dependencies]
# Job Objects (design §4.4). `Win32_Security` gates `CreateJobObjectW` (its first parameter is a
# `SECURITY_ATTRIBUTES`); `Win32_System_Threading` gates `JOBOBJECT_EXTENDED_LIMIT_INFORMATION`.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"
# A local fake proxy in the testProxy tests.
tokio = { version = "1.53.2", features = ["net"] }
# TypeScript bindings of the bridge types, exported by `cargo test` (src/bindings.rs).
ts-rs = "12.0.1"

# Process lifecycle tests. No libtest harness: the test binary doubles as the fake kernel it
# launches (see the file header), which needs its own `main`.
[[test]]
name = "launcher"
harness = false
